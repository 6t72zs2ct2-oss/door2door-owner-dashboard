<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Door2Door Detailing — Crew</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#14202b;--muted:#66727d;--line:#e2e7eb;--soft:#eef2f5;--green:#18794e;--red:#b42318;--blue:#175cd3;--amber:#9a6700;--shadow:0 8px 28px rgba(15,23,42,.07)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:10}.topbar{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;font-size:18px}.brand span{display:block;font-size:12px;font-weight:500;opacity:.72;margin-top:2px}.ghost{background:transparent;border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:9px 12px}.wrap{max-width:850px;margin:auto;padding:18px}.login{max-width:440px;margin:70px auto;background:var(--card);border-radius:20px;padding:28px;box-shadow:var(--shadow)}h1{font-size:27px;margin:0 0 6px}h2{font-size:20px;margin:0 0 14px}h3{font-size:16px;margin:0 0 6px}.sub,.meta{color:var(--muted);font-size:14px;line-height:1.55}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.primary{width:100%;border:0;border-radius:11px;background:#111827;color:#fff;padding:13px 16px;font-weight:750}.secondary{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;padding:10px 13px;font-weight:650}.msg{padding:11px 12px;border-radius:10px;background:#fff4f2;color:var(--red);font-size:13px;margin-top:12px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 20px}.kpi{background:#fff;padding:17px;border-radius:16px;box-shadow:var(--shadow)}.kpi .n{font-size:28px;font-weight:850}.kpi .l{font-size:12px;color:var(--muted);margin-top:3px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.tab.active{background:#111827;color:#fff;border-color:#111827}.list{display:grid;gap:12px}.job{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow)}.jobtop{display:flex;justify-content:space-between;gap:12px}.jobname{font-weight:800}.price{font-weight:850;font-size:18px;white-space:nowrap}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:var(--soft);color:#45515b}.status{padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.Requested{background:#fff4d6;color:var(--amber)}.Confirmed{background:#eaf2ff;color:var(--blue)}.Assigned{background:#eee9ff;color:#6941c6}.InProgress{background:#e8f7f0;color:var(--green)}.Completed{background:#e7f6ea;color:var(--green)}.Cancelled{background:#fdecec;color:var(--red)}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.detail{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.detail div{background:var(--soft);padding:11px;border-radius:10px}.detail small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.detail strong{font-size:13px}.empty{padding:38px 18px;text-align:center;color:var(--muted);background:#fff;border-radius:16px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:650px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}.sheethead{display:flex;justify-content:space-between;gap:12px}.x{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px}@media(max-width:650px){.kpis{grid-template-columns:1fr 1fr}.detail{grid-template-columns:1fr}.wrap{padding:14px}}
</style>

<style>
.photo-section{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.photo-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.photo-head h3{margin:0}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo-item{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft);aspect-ratio:1/1}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block}
.photo-item button{position:absolute;top:5px;right:5px;border:0;border-radius:999px;background:rgba(17,24,39,.82);color:#fff;width:28px;height:28px}
.photo-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.photo-box{background:#f8fafb;border:1px solid var(--line);border-radius:12px;padding:12px}
.photo-box h4{margin:0 0 7px;font-size:14px}
.photo-count{font-size:12px;color:var(--muted);margin-bottom:8px}
.photo-actions{display:flex;gap:7px;flex-wrap:wrap}
.photo-actions label{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:750;cursor:pointer}
.photo-actions input{display:none}
.photo-empty{font-size:12px;color:var(--muted);padding:8px 0}
@media(max-width:650px){.photo-columns{grid-template-columns:1fr}.photo-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="loginView" class="login">
  <div class="brand" style="color:#111827;font-size:20px">Door2Door Detailing<span style="color:#66727d">Crew Dashboard</span></div>
  <h1 style="margin-top:24px">Crew Sign in</h1>
  <div class="sub">Sign in to view jobs assigned to you.</div>
  <form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="primary" type="submit">Sign in</button></form>
  <div id="inviteView" class="hidden">
    <div class="sub" style="margin:18px 0 12px">Your invitation is ready. Create a password to finish setting up your crew account.</div>
    <form id="inviteForm"><div class="field"><label>Create password</label><input id="newPassword" type="password" minlength="8" required autocomplete="new-password"></div><div class="field"><label>Confirm password</label><input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div><button class="primary" type="submit">Create password &amp; continue</button></form>
  </div>
  <div id="loginMsg" class="msg hidden"></div>
</div>
<div id="appView" class="hidden">
<header class="top"><div class="topbar"><div class="brand">Door2Door Detailing<span>Crew Dashboard</span></div><button id="logout" class="ghost">Sign out</button></div></header>
<main class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 0 15px"><div><h1 id="hello">My Jobs</h1><div class="sub" id="welcome"></div></div><button class="secondary" id="refresh">↻ Refresh</button></div>
<section class="kpis"><div class="kpi"><div class="n" id="todayCount">—</div><div class="l">Today's jobs</div></div><div class="kpi"><div class="n" id="upcomingCount">—</div><div class="l">Next 7 days</div></div><div class="kpi"><div class="n" id="doneCount">—</div><div class="l">Completed</div></div></section>
<div class="tabs"><button class="tab active" data-tab="today">Today</button><button class="tab" data-tab="upcoming">Upcoming</button></div>
<section id="content" class="list"></section></main></div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheethead"><div><h2 id="modalTitle">Job</h2><div class="sub" id="modalSub"></div></div><button class="x" id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://bgpnadeodlqgbzivhjka.supabase.co';const SUPABASE_KEY='sb_publishable_GanTyB9ILFu66BzVeKko5Q_uk7QksL0';const AUTH='d2d_crew_auth_v1';
let state={tab:'today',bookings:[],staff:null,session:null};const $=id=>document.getElementById(id);
function token(){return state.session?.access_token||localStorage.getItem(AUTH+'_access')||''}
function showInviteSetup(){ $('loginForm').classList.add('hidden'); $('inviteView').classList.remove('hidden'); $('loginMsg').classList.add('hidden'); }
function showLoginForm(){ $('inviteView').classList.add('hidden'); $('loginForm').classList.remove('hidden'); }
function getHashParams(){ const raw=window.location.hash.replace(/^#/,''); return new URLSearchParams(raw); }
function getInviteParams(){
  const h=getHashParams(), q=new URLSearchParams(window.location.search);
  return {
    access:h.get('access_token')||q.get('access_token'),
    refresh:h.get('refresh_token')||q.get('refresh_token'),
    type:h.get('type')||q.get('type')||'',
    tokenHash:q.get('token_hash')||q.get('token')
  };
}
async function acceptInvite(){
  const p=getInviteParams();
  let access=p.access, refresh=p.refresh, type=p.type;
  if((!access || !refresh) && p.tokenHash && (type==='invite'||type==='recovery')){
    try{
      const verifyUrl=SUPABASE_URL+'/auth/v1/verify?token='+encodeURIComponent(p.tokenHash)+'&type='+encodeURIComponent(type)+'&redirect_to='+encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
      window.location.replace(verifyUrl);
      return true;
    }catch(e){ $('loginMsg').textContent='This invitation link could not be verified. Please ask the owner for a new invitation.'; $('loginMsg').classList.remove('hidden'); return false; }
  }
  if(!access || !refresh || !['invite','recovery',''].includes(type||'')) return false;
  state.session={access_token:access,refresh_token:refresh,user:null};
  try{
    const u=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+access}});
    const user=await u.json();
    if(!u.ok) throw new Error(user?.message||user?.msg||'This invitation link is no longer valid.');
    state.session.user=user;
    saveSession(state.session);
    window.history.replaceState({},document.title,window.location.pathname+window.location.search);
    showInviteSetup();
    return true;
  }catch(e){ saveSession(null); $('loginMsg').textContent=e.message; $('loginMsg').classList.remove('hidden'); return false; }
}
async function setInvitePassword(e){
  e.preventDefault(); $('loginMsg').classList.add('hidden');
  const p=$('newPassword').value, c=$('confirmPassword').value;
  if(p.length<8){$('loginMsg').textContent='Password must be at least 8 characters.';$('loginMsg').classList.remove('hidden');return;}
  if(p!==c){$('loginMsg').textContent='Passwords do not match.';$('loginMsg').classList.remove('hidden');return;}
  try{
    const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({password:p})});
    const j=await r.json(); if(!r.ok) throw new Error(j?.message||j?.msg||j?.error_description||'Could not create your password.');
    await loadProfile(); showApp(); await loadJobs();
  }catch(err){$('loginMsg').textContent=err.message;$('loginMsg').classList.remove('hidden');}
}
async function api(path,opts={}){const headers={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+token(),'Content-Type':'application/json',...(opts.headers||{})};const r=await fetch(SUPABASE_URL+path,{...opts,headers});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.message||data?.hint||data?.error_description||'Request failed');return data}
function saveSession(s){state.session=s;if(s){localStorage.setItem(AUTH+'_access',s.access_token);localStorage.setItem(AUTH+'_refresh',s.refresh_token)}else{localStorage.removeItem(AUTH+'_access');localStorage.removeItem(AUTH+'_refresh')}}
async function login(e){e.preventDefault();$('loginMsg').classList.add('hidden');try{const d=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});const j=await d.json();if(!d.ok)throw new Error(j.error_description||j.msg||'Could not sign in');saveSession(j);await loadProfile();showApp();await loadJobs()}catch(err){$('loginMsg').textContent=err.message;$('loginMsg').classList.remove('hidden')}}
async function restore(){const a=localStorage.getItem(AUTH+'_access'),r=localStorage.getItem(AUTH+'_refresh');if(!a||!r)return false;try{const d=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:r})});const j=await d.json();if(!d.ok)throw new Error();saveSession(j);await loadProfile();return true}catch{saveSession(null);return false}}
async function loadProfile(){const rows=await api('/rest/v1/staff?select=id,full_name,email,role,active&user_id=eq.'+encodeURIComponent(state.session.user.id));const me=rows[0];if(!me||me.role!=='crew'||!me.active)throw new Error('This account is not an active crew account. Please contact the owner.');state.staff=me}
async function loadJobs(){try{const today=localDate(),end=addDays(today,7);state.bookings=await api(`/rest/v1/bookings?select=*,customer:customers(full_name,phone,email,address),vehicle:vehicles(vehicle_type,make_model,color),service:services(name)&appointment_date=gte.${today}&appointment_date=lte.${end}&order=appointment_date.asc&order=appointment_time.asc&limit=200`);render()}catch(e){$('content').innerHTML=`<div class="msg">${escapeHtml(e.message)}</div>`}}
async function logout(){try{if(token())await fetch(SUPABASE_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token()}})}catch{}saveSession(null);$('appView').classList.add('hidden');$('loginView').classList.remove('hidden')}
function showApp(){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden')}
function localDate(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function money(n){return '$'+Number(n||0).toFixed(2).replace('.00','')}
function fmtDate(s){return s?new Date(s+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}):''}
function fmtTime(s){if(!s)return '';const [h,m]=s.slice(0,5).split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`}
function cls(s){return String(s||'').replaceAll(' ','')}
function escapeHtml(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const today=localDate(),end=addDays(today,7),a=state.bookings.filter(b=>state.tab==='today'?b.appointment_date===today:b.appointment_date>today&&b.appointment_date<=end);$('hello').textContent='Hi, '+(state.staff?.full_name||'Crew Member');$('welcome').textContent=(state.staff?.email||'')+' · '+fmtDate(today);$('todayCount').textContent=state.bookings.filter(b=>b.appointment_date===today).length;$('upcomingCount').textContent=state.bookings.filter(b=>b.appointment_date>=today&&b.appointment_date<=end).length;$('doneCount').textContent=state.bookings.filter(b=>b.booking_status==='Completed').length;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===state.tab));if(!a.length){$('content').innerHTML='<div class="empty"><div style="font-size:30px">✓</div><h3>No jobs</h3><div>There are no assigned jobs in this view.</div></div>';return}$('content').innerHTML=a.map(jobHtml).join('')}
function jobHtml(b){const c=b.customer||{},v=b.vehicle||{},s=b.service||{};return `<article class="job"><div class="jobtop"><div><div class="jobname">${escapeHtml(c.full_name||'Customer')}</div><div class="meta">${fmtDate(b.appointment_date)} · ${fmtTime(b.appointment_time)}<br>${escapeHtml(s.name||'Service')} · ${escapeHtml(v.make_model||'Vehicle')} ${v.color?'· '+escapeHtml(v.color):''}</div></div><div class="price">${money(b.total_price)}</div></div><div class="chips"><span class="status ${cls(b.booking_status)}">${escapeHtml(b.booking_status)}</span><span class="chip">${escapeHtml(b.booking_number)}</span></div><div class="meta">${escapeHtml(b.address||c.address||'No address')}<br>${escapeHtml(c.phone||'')}${c.email?' · '+escapeHtml(c.email):''}</div><div class="actions"><button class="primary" onclick="openJob('${b.id}')">View job</button></div></article>`}
function openJob(id){const b=state.bookings.find(x=>x.id===id);if(!b)return;const c=b.customer||{},v=b.vehicle||{},s=b.service||{};$('modalTitle').textContent=c.full_name||'Job';$('modalSub').textContent=`${b.booking_number} · ${fmtDate(b.appointment_date)} · ${fmtTime(b.appointment_time)}`;$('modalBody').innerHTML=`<div class="detail"><div><small>Service</small><strong>${escapeHtml(s.name||'')}</strong></div><div><small>Total</small><strong>${money(b.total_price)}</strong></div><div><small>Vehicle</small><strong>${escapeHtml(v.make_model||'')} ${v.color?'· '+escapeHtml(v.color):''}</strong></div><div><small>Phone</small><strong>${escapeHtml(c.phone||'')}</strong></div><div><small>Address</small><strong>${escapeHtml(b.address||c.address||'')}</strong></div><div><small>Payment</small><strong>${escapeHtml(b.payment_preference||'')}</strong></div></div><h3>Special requests</h3><div class="meta" style="background:var(--soft);padding:12px;border-radius:10px">${escapeHtml(b.special_requests||'None')}</div><div id="photoPanel"></div><div class="field"><label>Update job status</label><select id="jobStatus"><option>Assigned</option><option>In Progress</option><option>Completed</option></select></div><button class="primary" onclick="saveJobStatus('${b.id}')">Save status</button>`;$('jobStatus').value=['Assigned','In Progress','Completed'].includes(b.booking_status)?b.booking_status:'Assigned';$('modal').classList.remove('hidden');window.photoCanDelete=false;renderPhotoPanel(b.id,false)}
async function saveJobStatus(id){const status=$('jobStatus').value;try{await api('/rest/v1/rpc/crew_update_booking_status',{method:'POST',body:JSON.stringify({p_booking_id:id,p_status:status})});$('modal').classList.add('hidden');await loadJobs()}catch(e){alert(e.message)}}

function showForgotPassword(){$('forgotForm').classList.toggle('hidden');$('forgotEmail').value=$('email').value.trim();$('loginMsg').classList.add('hidden')}
async function sendForgotPassword(e){e.preventDefault();try{const email=$('forgotEmail').value.trim();const r=await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,options:{redirectTo:location.origin+location.pathname}})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.message||j?.msg||'Could not send reset email');$('loginMsg').textContent='Password reset email sent. Check your inbox.';$('loginMsg').className='msg ok';}catch(e){$('loginMsg').textContent=e.message;$('loginMsg').className='msg'}}
$('loginForm').addEventListener('submit',login);$('forgotForm').addEventListener('submit',sendForgotPassword);$('inviteForm').addEventListener('submit',setInvitePassword);$('logout').addEventListener('click',logout);$('refresh').addEventListener('click',loadJobs);$('closeModal').addEventListener('click',()=>$('modal').classList.add('hidden'));$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.add('hidden')});document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>{state.tab=x.dataset.tab;render()}));
(async()=>{try{if(await acceptInvite())return;if(await restore()){showApp();await loadJobs()}}catch(e){saveSession(null);showLoginForm();$('loginMsg').textContent=e.message;$('loginMsg').classList.remove('hidden')}})();

async function photoApi(path,opts={}){return api(path,opts)}
let photoCache={};
async function loadBookingPhotos(bookingId){return photoApi('/rest/v1/booking_photos?booking_id=eq.'+encodeURIComponent(bookingId)+'&select=id,booking_id,photo_type,storage_path,uploaded_by,uploaded_at&order=uploaded_at.asc&limit=100')}
async function signedPhotoUrl(path){const r=await fetch(SUPABASE_URL+'/storage/v1/object/sign/booking-photos/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({expiresIn:3600})});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.message||'Could not create photo URL');return j.signedURL?.startsWith('http')?j.signedURL:SUPABASE_URL+(j.signedURL||'')}
async function renderPhotoPanel(bookingId,canDelete=false){const el=$('photoPanel');if(!el)return;el.innerHTML='<div class="photo-empty">Loading photos…</div>';try{const rows=await loadBookingPhotos(bookingId);rows.forEach(r=>photoCache[r.id]=r);const before=rows.filter(r=>r.photo_type==='before'),after=rows.filter(r=>r.photo_type==='after');el.innerHTML='<div class="photo-section"><div class="photo-head"><h3>Before & After Photos</h3><span class="photo-count">'+rows.length+' photo'+(rows.length===1?'':'s')+'</span></div><div class="photo-columns">'+photoBoxHtml(bookingId,'before',before,canDelete)+photoBoxHtml(bookingId,'after',after,canDelete)+'</div></div>';await fillPhotoImages(rows)}catch(e){el.innerHTML='<div class="msg">Could not load photos: '+escapeHtml(e.message)+'</div>'}}
function photoBoxHtml(bid,type,rows,canDelete){const label=type==='before'?'Before Photos':'After Photos';let html='<div class="photo-box"><h4>'+label+'</h4><div class="photo-count">'+rows.length+' photo'+(rows.length===1?'':'s')+'</div><div class="photo-actions"><label>📷 Take / Upload<input type="file" accept="image/*" capture="environment" multiple onchange="uploadBookingPhotos(\''+bid+'\',\''+type+'\',this)"></label></div><div class="photo-grid">';if(rows.length){html+=rows.map(r=>'<div class="photo-item" id="photo_'+r.id+'"><div class="photo-empty">Loading…</div>'+(canDelete?'<button type="button" onclick="deleteBookingPhoto(\''+r.id+'\',\''+bid+'\')">×</button>':'')+'</div>').join('')}else{html+='<div class="photo-empty">No photos yet.</div>'}return html+'</div></div>'}
async function fillPhotoImages(rows){await Promise.all(rows.map(async r=>{try{const u=await signedPhotoUrl(r.storage_path);const el=$('photo_'+r.id);if(el){const img=document.createElement('img');img.src=u;img.alt=r.photo_type+' photo';img.loading='lazy';const ph=el.querySelector('.photo-empty');if(ph)ph.replaceWith(img)}}catch{}}))}
async function uploadBookingPhotos(bookingId,type,input){const files=Array.from(input.files||[]);if(!files.length)return;try{input.disabled=true;for(const file of files){if(file.size>10*1024*1024)throw new Error(file.name+' is larger than 10 MB.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=bookingId+'/'+type+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,9)+'.'+ext;const form=new FormData();form.append('file',file,file.name);const r=await fetch(SUPABASE_URL+'/storage/v1/object/booking-photos/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token(),'x-upsert':'false'},body:form});let j={};try{j=await r.json()}catch{}if(!r.ok)throw new Error(j?.message||j?.error||'Upload failed');await photoApi('/rest/v1/booking_photos',{method:'POST',body:JSON.stringify({booking_id:bookingId,photo_type:type,storage_path:path,uploaded_by:state.session?.user?.id||''})})}await renderPhotoPanel(bookingId,!!window.photoCanDelete)}catch(e){alert(e.message)}finally{input.disabled=false;input.value=''}}
async function deleteBookingPhoto(photoId,bookingId){const row=photoCache[photoId];if(!row)return;if(!confirm('Delete this photo?'))return;try{const r=await fetch(SUPABASE_URL+'/storage/v1/object/booking-photos/'+row.storage_path,{method:'DELETE',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token()}});if(!r.ok){let j={};try{j=await r.json()}catch{}throw new Error(j?.message||'Could not delete photo file')}await photoApi('/rest/v1/booking_photos?id=eq.'+encodeURIComponent(photoId),{method:'DELETE',headers:{Prefer:'return=minimal'}});delete photoCache[photoId];await renderPhotoPanel(bookingId,true)}catch(e){alert(e.message)}}
</script></body></html>
